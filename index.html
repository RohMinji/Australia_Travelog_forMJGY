<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>기엽이 & 민지의 호주여행</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#1E2A2A; --paper:#F7F2E7; --paperDark:#EFE7D4; --harbour:#0F3B40;
    --harbourLight:#1B565D; --coral:#E4572E; --coralDark:#C7431D; --gold:#C79A2E;
    --line:#D9CFB4; --cream:#FFFDF8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 24px rgba(0,0,0,.08);position:relative;}

  /* header */
  header{background:linear-gradient(135deg,var(--harbour),var(--harbourLight));color:#fff;padding:32px 20px 24px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;inset:0;opacity:.1;background-image:repeating-linear-gradient(45deg,transparent,transparent 18px,rgba(255,255,255,.4) 18px,rgba(255,255,255,.4) 19px);}
  .hdr-row{position:relative;display:flex;justify-content:space-between;align-items:flex-start;}
  .hdr-eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;}
  .hdr-title{font-size:24px;font-weight:700;line-height:1.3;margin:0;font-family:Georgia,'Noto Serif KR',serif;}
  .hdr-btn{display:flex;align-items:center;gap:6px;border-radius:999px;padding:9px 12px;font-size:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;}
  .dot{width:8px;height:8px;border-radius:50%;background:#94A3B8;margin-left:2px;}
  .dot.on{background:#4ADE80;}

  /* nav */
  nav{position:sticky;top:0;z-index:20;display:flex;background:var(--cream);border-bottom:1px solid var(--line);}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0;border:none;background:none;font-size:12px;font-weight:500;color:var(--ink);border-bottom:2px solid transparent;cursor:pointer;}
  nav button.active{color:var(--coral);border-color:var(--coral);}
  nav svg{width:18px;height:18px;}

  /* day stamps */
  .stamp-row{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 6px;}
  .stamp{flex-shrink:0;min-width:66px;border:2px dashed var(--line);border-radius:999px;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 8px;cursor:pointer;transform:rotate(-2deg);}
  .stamp.active{border-color:var(--coral);color:var(--coral);background:#FFF6F1;transform:rotate(0);}
  .stamp .l1{font-size:9px;letter-spacing:.15em;text-transform:uppercase;opacity:.6;}
  .stamp .l2{font-size:14px;font-weight:700;}
  .stamp .l3{font-size:9px;opacity:.6;}

  /* itinerary */
  .day-card{margin:0 16px 12px;border:1px solid var(--line);background:var(--cream);border-radius:18px;overflow:hidden;}
  .day-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;background:none;border:none;text-align:left;cursor:pointer;}
  .day-badge{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--harbour);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .day-badge .t1{font-size:9px;opacity:.7;line-height:1;}
  .day-badge .t2{font-size:14px;font-weight:700;line-height:1;}
  .day-head-info{flex:1;min-width:0;}
  .day-head-info p.title{font-size:14px;font-weight:600;margin:0;}
  .day-head-info p.sub{font-size:12px;opacity:.5;margin:2px 0 0;}
  .chev{flex-shrink:0;transition:transform .2s;}
  .chev.open{transform:rotate(180deg);}
  .day-body{border-top:1px solid var(--line);padding:14px 16px 16px;}
  .maptoggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--harbour);background:var(--paperDark);border:1px solid var(--line);border-radius:999px;padding:7px 12px;margin-bottom:12px;cursor:pointer;}
  .daymap{width:100%;height:220px;border-radius:14px;overflow:hidden;margin-bottom:14px;display:none;border:1px solid var(--line);}
  .daymap.show{display:block;}
  .timeline{position:relative;margin-left:6px;padding-left:20px;border-left:2px dashed var(--line);}
  .titem{position:relative;padding-bottom:18px;}
  .titem:last-child{padding-bottom:0;}
  .titem .tdot{position:absolute;left:-26px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--coral);border:2px solid var(--cream);}
  .titem .ttime{font-size:12px;font-weight:700;color:var(--coral);display:block;margin-bottom:3px;}
  .titem .tname{font-size:14px;font-weight:600;margin:0;}
  .titem .tmeta{font-size:12px;opacity:.6;display:flex;align-items:flex-start;gap:4px;margin-top:3px;}
  .titem .tdesc{font-size:12px;margin-top:5px;}
  .titem .tnote{font-size:12px;background:#FFF3E9;color:var(--coralDark);border-radius:8px;padding:5px 8px;margin-top:5px;display:inline-flex;gap:5px;align-items:flex-start;}
  .dayhead-actions{display:flex;align-items:center;gap:6px;}
  .iconbtn{border:none;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--harbour);}
  .iconbtn:hover{background:var(--paperDark);}
  .edit-row{border:1px solid var(--line);background:var(--paperDark);border-radius:12px;padding:10px;margin-bottom:10px;}
  .edit-row .erow{display:flex;gap:6px;margin-bottom:6px;}
  .edit-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;outline:none;background:var(--cream);min-width:0;}
  .edit-row .etime{flex:0 0 64px;}
  .edit-row .etools{display:flex;gap:4px;flex-shrink:0;}
  .edit-row .etools button{border:none;background:var(--cream);border:1px solid var(--line);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--harbour);}
  .edit-row .etools button.danger{color:var(--coral);}
  .itin-toolbar{display:flex;gap:8px;padding:0 16px 10px;align-items:center;}
  .itin-toolbar .sync-status{font-size:11px;opacity:.5;flex:1;}

  /* expense/diary shared */
  .summary-box{margin:0 16px;background:var(--harbour);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
  .summary-box .lab{font-size:11px;opacity:.7;margin:0;}
  .summary-box .val{font-size:18px;font-weight:700;margin:2px 0 0;}
  .summary-box .val small{font-size:11px;font-weight:400;opacity:.7;}
  .btn{border:none;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:600;color:#fff;background:var(--coral);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn:disabled{opacity:.4;}
  .entry-list{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .entry{display:flex;gap:10px;border:1px solid var(--line);background:var(--cream);border-radius:14px;padding:10px;}
  .entry img{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .entry .ph-empty{width:52px;height:52px;border-radius:10px;background:var(--paperDark);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.4;}
  .entry .body{flex:1;min-width:0;}
  .entry .body p.place{font-size:13px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .body p.item{font-size:12px;opacity:.6;margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry .body p.amt{font-size:12px;font-weight:600;color:var(--coral);margin:4px 0 0;}
  .entry .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
  .entry .side button{background:none;border:none;cursor:pointer;opacity:.4;}
  .empty-msg{text-align:center;font-size:13px;opacity:.4;padding:26px 0;}

  .form-box{margin:18px 16px 0;background:var(--paperDark);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .form-box .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:0 0 2px;}
  .form-box input, .form-box textarea{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:10px;padding:10px 12px;font-size:13px;outline:none;font-family:inherit;}
  .form-row{display:flex;gap:8px;}
  .file-btn{border:1px solid var(--line);background:var(--cream);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .file-btn input{display:none;}

  .person-row{display:flex;gap:8px;margin:14px 16px 0;}
  .person-btn{flex:1;border:1px solid var(--line);background:var(--cream);border-radius:14px;padding:11px 0;font-size:13px;font-weight:600;cursor:pointer;}
  .person-btn.active{background:var(--coral);border-color:var(--coral);color:#fff;}
  .diary-box{margin:14px 16px 0;border:1px solid var(--line);background:var(--cream);border-radius:18px;padding:16px;}
  .diary-box .drow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .diary-box .drow p{font-size:12px;font-weight:600;opacity:.6;margin:0;}
  .diary-box .saved{font-size:11px;color:#22C55E;display:flex;align-items:center;gap:4px;}
  .diary-box textarea{width:100%;min-height:170px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;font-size:13px;line-height:1.7;font-family:Georgia,'Noto Serif KR',serif;outline:none;resize:vertical;}
  .diary-box .dphoto{width:100%;height:150px;object-fit:cover;border-radius:14px;margin-top:10px;}
  .diary-box .drow2{display:flex;gap:8px;margin-top:10px;}
  .diary-box .drow2 label, .diary-box .drow2 button{flex:1;justify-content:center;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{width:100%;max-width:480px;background:var(--cream);border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h2{font-size:15px;font-weight:700;margin:0;}
  .modal-head button{background:none;border:none;cursor:pointer;}
  .sect-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.5;margin:0 0 8px;}
  .modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:8px;outline:none;}
  .hint{font-size:11px;opacity:.5;line-height:1.6;margin-top:8px;}
  .result-ok{font-size:12px;color:#22C55E;display:flex;align-items:center;gap:5px;margin-top:8px;}
  .result-fail{font-size:12px;color:var(--coral);display:flex;align-items:center;gap:5px;margin-top:8px;}
  .divider{border-top:1px solid var(--line);margin:18px 0 14px;}
  .rate-row{display:flex;align-items:center;gap:8px;}
  .rate-row input{margin:0;}

  /* toast */
  #toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:448px;margin:0 auto;z-index:60;display:none;justify-content:center;}
  #toast .box{border-radius:999px;padding:10px 16px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);}
  .share-note{margin:16px;padding:12px 14px;background:#EAF4F1;border:1px solid #CFE4DE;border-radius:14px;font-size:12px;line-height:1.6;color:var(--harbour);}

  svg.icon{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>

/* ---------------- load shared itinerary from GitHub (public raw, no token needed) ---------------- */
async function loadItineraryFromGithub(){
  try{
    const { owner, repo, branch } = state.github;
    const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/itinerary.json?t=${Date.now()}`);
    if(!res.ok) return; // not saved yet — keep defaults
    const remote = await res.json();
    if(remote && typeof remote === "object"){
      state.itinerary = remote;
      state.itinerarySynced = true;
      if(state.tab === "itinerary") renderTabContent();
    }
  }catch(e){ /* offline or not created yet — keep local defaults */ }
}

/* ---------------- helpers ---------------- */
function fileToBase64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
function b64Utf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function downloadText(filename, text){
  const blob = new Blob([text], {type:"text/markdown;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function githubUpsert(cfg, path, base64Content, message){
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
  const headers = { Authorization:`token ${cfg.token}`, Accept:"application/vnd.github+json" };
  let sha;
  try{
    const getRes = await fetch(`${url}?ref=${encodeURIComponent(cfg.branch)}`, {headers});
    if(getRes.ok){ const j = await getRes.json(); sha = j.sha; }
  }catch(e){}
  const body = { message, content: base64Content, branch: cfg.branch };
  if(sha) body.sha = sha;
  const putRes = await fetch(url, { method:"PUT", headers:{...headers,"Content-Type":"application/json"}, body: JSON.stringify(body) });
  if(!putRes.ok){ const t = await putRes.text().catch(()=> ""); throw new Error(`(${putRes.status}) ${t.slice(0,180)}`); }
  return true;
}
function showToast(type, text){
  state.toast = {type, text};
  renderToast();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ state.toast=null; renderToast(); }, 3500);
}

function initDayMap(dayId){
  const items = (state.itinerary[dayId]||[]).filter(i=>i.lat);
  if(items.length===0) return;
  const containerId = `map-${dayId}`;
  const container = document.getElementById(containerId);
  if(!container) return;
  if(leafletMaps[dayId]){ leafletMaps[dayId].invalidateSize(); return; }
  const map = L.map(containerId, { zoomControl:true, attributionControl:false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map);
  const latlngs = items.map(i=>[i.lat,i.lng]);
  const bounds = L.latLngBounds(latlngs);
  items.forEach((it,idx)=>{
    const icon = L.divIcon({
      className:"",
      html:`<div style="background:#E4572E;color:#fff;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);">
              <span style="transform:rotate(45deg);font-size:11px;font-weight:700;">${idx+1}</span>
            </div>`,
      iconSize:[24,24], iconAnchor:[12,22],
    });
    L.marker([it.lat,it.lng], {icon}).addTo(map).bindPopup(`<b>${it.name}</b><br/>${it.time}`);
  });
  if(latlngs.length>1){
    L.polyline(latlngs, { color:"#0F3B40", weight:3, dashArray:"6 6", opacity:.8 }).addTo(map);
  }
  map.fitBounds(bounds, { padding:[28,28] });
  leafletMaps[dayId] = map;
}

/* ================= EXPENSE TAB ================= */
function ExpenseTab(){
  const dayEntries = state.expenses.filter(e=>e.dayId===state.expDay);
  const total = dayEntries.reduce((s,e)=>s+Number(e.aud||0),0);
  return `
  <div style="padding-bottom:32px;">
    <div class="stamp-row">${DAYS.map(d=>Stamp(d, state.expDay===d.id, 'exp')).join("")}</div>
    <div class="summary-box">
      <div>
        <p class="lab">${DAYS.find(d=>d.id===state.expDay).md} 지출 합계</p>
        <p class="val">A$${total.toFixed(2)} <small>(약 ₩${Math.round(total*state.rate).toLocaleString()})</small></p>
      </div>
      <button class="btn" id="syncExpDay" ${dayEntries.length===0?"disabled":""}>${state.github.connected?ICON.github:''}${state.github.connected?'GitHub 저장':'다운로드'}</button>
    </div>
    <div class="entry-list">
      ${dayEntries.length===0?`<p class="empty-msg">이 날의 지출 내역이 아직 없어요.</p>`:dayEntries.map(e=>`
        <div class="entry">
          ${e.photo?`<img src="${e.photo}"/>`:`<div class="ph-empty">${ICON.camera}</div>`}
          <div class="body">
            <p class="place">${e.place}</p>
            ${e.item?`<p class="item">${e.item}</p>`:""}
            <p class="amt">A$${Number(e.aud).toFixed(2)} · ₩${Math.round(e.aud*state.rate).toLocaleString()}</p>
          </div>
          <div class="side">
            ${e.synced?ICON.check:""}
            <button data-remove="${e.id}">${ICON.trash}</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div class="form-box">
      <p class="lbl">지출 추가</p>
      <input id="fPlace" placeholder="장소 (예: 본다이 아이스버그 클럽)" value="${state.expForm.place}"/>
      <input id="fItem" placeholder="구매 항목 (예: 플랫화이트 2잔)" value="${state.expForm.item}"/>
      <div class="form-row">
        <input id="fAud" type="number" placeholder="금액 (AUD)" value="${state.expForm.aud}" style="flex:1;"/>
        <label class="file-btn">${ICON.camera} ${state.expForm.photo?'선택됨':'영수증'}<input type="file" id="fPhoto" accept="image/*"/></label>
      </div>
      <button class="btn" id="addExpense" style="justify-content:center;">${ICON.plus} 추가하기</button>
    </div>
  </div>`;
}

function Stamp(day, active, tag){
  return `<button class="stamp ${active?'active':''}" data-${tag}day="${day.id}">
    <span class="l1">Day ${day.id}</span><span class="l2">${day.md}</span><span class="l3">${day.wd}</span>
  </button>`;
}

function buildExpenseMd(day, entries){
  const total = entries.reduce((s,e)=>s+Number(e.aud||0),0);
  let md = `# 가계부 — ${day.md} (${day.wd})\n\n`;
  md += `| 장소 | 항목 | AUD | KRW(약) |\n|---|---|---|---|\n`;
  entries.forEach(e=>{ md += `| ${e.place} | ${e.item||"-"} | $${Number(e.aud).toFixed(2)} | ₩${Math.round(e.aud*state.rate).toLocaleString()} |\n`; });
  md += `\n**합계: A$${total.toFixed(2)} (약 ₩${Math.round(total*state.rate).toLocaleString()}, 환율 1AUD≈${state.rate}KRW 기준)**\n`;
  return md;
}

/* ================= DIARY TAB ================= */
function DiaryTab(){
  const key = `${state.diaryDay}-${state.diaryPerson}`;
  const cur = state.diary[key] || {text:"", photo:null, synced:false};
  const day = DAYS.find(d=>d.id===state.diaryDay);
  return `
  <div style="padding-bottom:32px;">
    <div class="stamp-row">${DAYS.map(d=>Stamp(d, state.diaryDay===d.id, 'dia')).join("")}</div>
    <div class="person-row">
      ${["기엽이","민지"].map(p=>`<button class="person-btn ${state.diaryPerson===p?'active':''}" data-person="${p}">${p}의 일기</button>`).join("")}
    </div>
    <div class="diary-box">
      <div class="drow">
        <p>${day.md} · ${state.diaryPerson}</p>
        ${cur.synced?`<span class="saved">${ICON.check} 저장됨</span>`:""}
      </div>
      <textarea id="diaryText" placeholder="오늘 하루는 어땠나요? 자유롭게 적어보세요...">${cur.text||""}</textarea>
      ${cur.photo?`<img class="dphoto" src="${cur.photo}"/>`:""}
      <div class="drow2">
        <label class="file-btn">${ICON.camera} 사진 첨부<input type="file" id="diaryPhoto" accept="image/*"/></label>
        <button class="btn" id="diarySave">${state.github.connected?ICON.save:''} ${state.github.connected?'GitHub 저장':'다운로드'}</button>
      </div>
    </div>
    <div class="share-note">${ICON.info} 남편분께 보여주고 싶다면 우측 상단 공유 버튼으로 이 페이지 링크를 보내거나, GitHub 저장소를 GitHub Pages로 공개하면 누구나 접속 가능한 링크가 생겨요.</div>
  </div>`;
}

/* ---------------- events ---------------- */
function bindTabEvents(){
  if(state.tab==="itinerary"){
    document.querySelectorAll(".day-head").forEach(b=>{
      b.onclick = ()=>{
        const id = Number(b.dataset.day);
        state.openDay = state.openDay===id? null : id;
        renderTabContent();
      };
    });
    document.querySelectorAll("[data-maptoggle]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const id = Number(b.dataset.maptoggle);
        state.mapOpenDays[id] = !state.mapOpenDays[id];
        renderTabContent();
        if(state.mapOpenDays[id]) requestAnimationFrame(()=>setTimeout(()=>initDayMap(id),50));
      };
    });
    // if a map is already flagged open (kept state across day toggle), init it
    Object.keys(state.mapOpenDays).forEach(id=>{
      if(state.mapOpenDays[id]) setTimeout(()=>initDayMap(Number(id)),50);
    });

    // enter edit mode
    document.querySelectorAll("[data-startedit]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const id = Number(b.dataset.startedit);
        state.editDay = id;
        state.editBackup = JSON.parse(JSON.stringify(state.itinerary[id]||[]));
        renderTabContent();
      };
    });

    // field edits (time/name/address/hours/desc/note)
    document.querySelectorAll(".edit-row input[data-f]").forEach(inp=>{
      inp.oninput = ()=>{
        const idx = Number(inp.dataset.idx);
        const field = inp.dataset.f;
        const dayId = state.editDay;
        if(!state.itinerary[dayId][idx]) return;
        state.itinerary[dayId][idx][field] = inp.value;
      };
    });

    // reorder
    document.querySelectorAll("[data-move]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const dayId = state.editDay;
        const idx = Number(b.dataset.idx);
        const dir = b.dataset.move;
        const arr = state.itinerary[dayId];
        const swapWith = dir==="up"? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=arr.length) return;
        [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
        renderTabContent();
      };
    });

    // delete item
    document.querySelectorAll("[data-delitem]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const dayId = state.editDay;
        const idx = Number(b.dataset.delitem);
        state.itinerary[dayId].splice(idx,1);
        renderTabContent();
      };
    });

    // add item
    const addBtn = document.querySelector("[data-additem]");
    if(addBtn) addBtn.onclick = (e)=>{
      e.stopPropagation();
      const dayId = Number(addBtn.dataset.additem);
      state.itinerary[dayId].push({ time:"", name:"새 장소", address:"", hours:"", desc:"", note:"" });
      renderTabContent();
    };

    // cancel edit
    document.querySelectorAll("[data-canceledit]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        const dayId = Number(b.dataset.canceledit);
        state.itinerary[dayId] = state.editBackup || state.itinerary[dayId];
        state.editDay = null;
        state.editBackup = null;
        renderTabContent();
      };
    });

    // done editing
    document.querySelectorAll("[data-doneedit]").forEach(b=>{
      b.onclick = (e)=>{
        e.stopPropagation();
        state.editDay = null;
        state.editBackup = null;
        state.itinerarySynced = false;
        renderTabContent();
      };
    });

    // save whole itinerary
    const saveBtn = document.getElementById("saveItinerary");
    if(saveBtn) saveBtn.onclick = async ()=>{
      const json = JSON.stringify(state.itinerary, null, 2);
      if(!state.github.connected){
        downloadText("itinerary.json", json);
        showToast("info","GitHub 미연결 — itinerary.json 파일로 다운로드했습니다.");
        return;
      }
      saveBtn.disabled = true;
      try{
        await githubUpsert(state.github, "itinerary.json", b64Utf8(json), "여행일정 업데이트");
        state.itinerarySynced = true;
        showToast("success","전체 일정을 GitHub에 저장했습니다.");
      }catch(err){
        showToast("error", `저장 실패: ${err.message}`);
      }finally{
        saveBtn.disabled = false;
        renderTabContent();
      }
    };
  }
  if(state.tab==="expense"){
    document.querySelectorAll("[data-expday]").forEach(b=>{
      b.onclick = ()=>{ state.expDay = Number(b.dataset.expday); renderTabContent(); };
    });
    document.querySelectorAll("[data-remove]").forEach(b=>{
      b.onclick = ()=>{ state.expenses = state.expenses.filter(e=>e.id!==Number(b.dataset.remove)); renderTabContent(); };
    });
    const fPlace=document.getElementById("fPlace"), fItem=document.getElementById("fItem"), fAud=document.getElementById("fAud"), fPhoto=document.getElementById("fPhoto");
    fPlace.oninput = ()=>state.expForm.place=fPlace.value;
    fItem.oninput = ()=>state.expForm.item=fItem.value;
    fAud.oninput = ()=>state.expForm.aud=fAud.value;
    fPhoto.onchange = async ()=>{
      const f = fPhoto.files[0]; if(!f) return;
      state.expForm.photo = await fileToBase64(f);
      state.expForm.photoName = f.name;
      renderTabContent();
    };
    document.getElementById("addExpense").onclick = ()=>{
      if(!state.expForm.place || !state.expForm.aud) return;
      state.expenses.push({ id:Date.now(), dayId:state.expDay, place:state.expForm.place, item:state.expForm.item, aud:Number(state.expForm.aud), photo:state.expForm.photo, photoName:state.expForm.photoName, synced:false });
      state.expForm = { place:"", item:"", aud:"", photo:null, photoName:"" };
      renderTabContent();
    };
    document.getElementById("syncExpDay").onclick = async ()=>{
      const day = DAYS.find(d=>d.id===state.expDay);
      const dayEntries = state.expenses.filter(e=>e.dayId===state.expDay);
      const md = buildExpenseMd(day, dayEntries);
      if(!state.github.connected){ downloadText(`${day.date}-가계부.md`, md); showToast("info","GitHub 미연결 — 파일로 다운로드했습니다."); return; }
      try{
        await githubUpsert(state.github, `expenses/${day.date}.md`, b64Utf8(md), `가계부 업데이트: ${day.date}`);
        for(const e of dayEntries){
          if(e.photo && !e.synced){
            const ext = (e.photoName||"photo.jpg").split(".").pop();
            await githubUpsert(state.github, `expenses/photos/${day.date}-${e.id}.${ext}`, e.photo.split(",")[1], `영수증 사진: ${day.date}`);
          }
        }
        state.expenses = state.expenses.map(e=> e.dayId===state.expDay? {...e, synced:true} : e);
        showToast("success","GitHub에 저장했습니다.");
        renderTabContent();
      }catch(err){ showToast("error", `저장 실패: ${err.message}`); }
    };
  }
  if(state.tab==="diary"){
    document.querySelectorAll("[data-diaday]").forEach(b=>{
      b.onclick = ()=>{ state.diaryDay = Number(b.dataset.diaday); renderTabContent(); };
    });
    document.querySelectorAll("[data-person]").forEach(b=>{
      b.onclick = ()=>{ state.diaryPerson = b.dataset.person; renderTabContent(); };
    });
    const key = `${state.diaryDay}-${state.diaryPerson}`;
    const txt = document.getElementById("diaryText");
    txt.oninput = ()=>{
      state.diary[key] = { ...(state.diary[key]||{}), text:txt.value, synced:false };
    };
    document.getElementById("diaryPhoto").onchange = async (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const dataUrl = await fileToBase64(f);
      state.diary[key] = { ...(state.diary[key]||{text:txt.value}), photo:dataUrl, photoName:f.name, synced:false };
      renderTabContent();
    };
    document.getElementById("diarySave").onclick = async ()=>{
      const day = DAYS.find(d=>d.id===state.diaryDay);
      const cur = state.diary[key] || {text:txt.value};
      const md = `# ${day.md} (${day.wd}) 여행일기 — ${state.diaryPerson}\n\n_날짜: ${day.date}_\n\n${cur.text||"_(작성된 내용 없음)_"}\n`;
      if(!state.github.connected){ downloadText(`${day.date}-${state.diaryPerson}.md`, md); showToast("info","GitHub 미연결 — 파일로 다운로드했습니다."); return; }
      try{
        await githubUpsert(state.github, `diary/${day.date}-${state.diaryPerson}.md`, b64Utf8(md), `여행일기: ${day.date} ${state.diaryPerson}`);
        if(cur.photo){
          const ext = (cur.photoName||"photo.jpg").split(".").pop();
          await githubUpsert(state.github, `diary/photos/${day.date}-${state.diaryPerson}.${ext}`, cur.photo.split(",")[1], `여행일기 사진: ${day.date} ${state.diaryPerson}`);
        }
        state.diary[key] = { ...cur, synced:true };
        showToast("success","GitHub에 저장했습니다.");
        renderTabContent();
      }catch(err){ showToast("error", `저장 실패: ${err.message}`); }
    };
  }
}

/* ---------------- settings modal ---------------- */
function renderModal(){
  const root = document.getElementById("modalRoot");
  if(!state.settingsOpen){ root.innerHTML=""; return; }
  const g = state.github;
  root.innerHTML = `
  <div class="overlay" id="ovl">
    <div class="modal">
      <div class="modal-head"><h2>설정</h2><button id="closeModal">${ICON.x}</button></div>
      <p class="sect-lbl">GitHub 연동</p>
      <input id="ghOwner" placeholder="GitHub 사용자명 (owner)" value="${g.owner}"/>
      <input id="ghRepo" placeholder="저장소 이름 (repo)" value="${g.repo}"/>
      <input id="ghBranch" placeholder="브랜치 (기본: main)" value="${g.branch}"/>
      <input id="ghToken" type="password" placeholder="Personal Access Token (repo 권한)" value="${g.token}"/>
      <button class="btn" id="testConn" style="width:100%;justify-content:center;background:#0F3B40;">${ICON.github} 연결 테스트</button>
      <div id="connResult"></div>
      <p class="hint">토큰은 이 브라우저 세션에만 저장되며 새로고침 시 사라져요. github.com/settings/tokens 에서 "repo" 권한으로 발급받으세요. 연결하지 않아도 파일(.md/사진)을 직접 다운로드할 수 있어요.</p>
      <div class="divider"></div>
      <p class="sect-lbl">환율</p>
      <div class="rate-row">
        <span style="font-size:13px;opacity:.6;">1 AUD =</span>
        <input id="rateInput" type="number" value="${state.rate}" style="flex:1;"/>
        <span style="font-size:13px;opacity:.6;">KRW</span>
      </div>
      <button class="btn" id="doneModal" style="width:100%;justify-content:center;margin-top:18px;">완료</button>
    </div>
  </div>`;
  document.getElementById("closeModal").onclick = ()=>{ state.settingsOpen=false; renderModal(); };
  document.getElementById("ovl").onclick = (e)=>{ if(e.target.id==="ovl"){ state.settingsOpen=false; renderModal(); } };
  document.getElementById("ghOwner").oninput = e=>g.owner=e.target.value;
  document.getElementById("ghRepo").oninput = e=>g.repo=e.target.value;
  document.getElementById("ghBranch").oninput = e=>g.branch=e.target.value;
  document.getElementById("ghToken").oninput = e=>g.token=e.target.value;
  document.getElementById("rateInput").oninput = e=>{ state.rate = Number(e.target.value)||0; };
  document.getElementById("testConn").onclick = async ()=>{
    const resBox = document.getElementById("connResult");
    resBox.innerHTML = `<p class="hint">${ICON.loader} 연결 확인 중...</p>`;
    try{
      const res = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}`, { headers:{Authorization:`token ${g.token}`, Accept:"application/vnd.github+json"} });
      if(!res.ok) throw new Error(`상태 코드 ${res.status}`);
      g.connected = true;
      resBox.innerHTML = `<p class="result-ok">${ICON.check} 연결 성공! 이제부터 저장 시 GitHub에 자동 반영됩니다.</p>`;
      document.querySelector(".dot").classList.add("on");
    }catch(e){
      g.connected = false;
      resBox.innerHTML = `<p class="result-fail">${ICON.alert} 연결 실패. owner/repo/token을 확인해주세요.</p>`;
    }
  };
  document.getElementById("doneModal").onclick = ()=>{ state.settingsOpen=false; renderModal(); render(); };
}

/* ---------------- toast ---------------- */
function renderToast(){
  const t = document.getElementById("toast");
  if(!t) return;
  if(!state.toast){ t.style.display="none"; t.innerHTML=""; return; }
  const bg = state.toast.type==="error"?"#FEE2E2":state.toast.type==="success"?"#DCFCE7":"#E0F2FE";
  const fg = state.toast.type==="error"?"#B91C1C":state.toast.type==="success"?"#15803D":"#0369A1";
  t.style.display="flex";
  t.innerHTML = `<div class="box" style="background:${bg};color:${fg};">${state.toast.text}<button id="toastX" style="background:none;border:none;cursor:pointer;color:inherit;">${ICON.x}</button></div>`;
  document.getElementById("toastX").onclick = ()=>{ state.toast=null; renderToast(); };
}

/* spin animation */
const styleTag = document.createElement("style");
styleTag.textContent = `.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`;
document.head.appendChild(styleTag);

render();
loadItineraryFromGithub();
</script>
